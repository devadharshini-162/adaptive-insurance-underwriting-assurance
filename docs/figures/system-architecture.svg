<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Insurance Submission System Architecture</title>
  <desc id="desc">Customer and underwriter portals connect through a JWT protected REST API to processing services and PostgreSQL.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#263238}.h{font-size:25px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#546e7a}.box{stroke:#355c52;stroke-width:2;rx:18}.arrow{stroke:#536d63;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536d63"/></marker></defs>
  <rect width="1200" height="650" fill="#fbfaf5"/>
  <text x="600" y="48" text-anchor="middle" class="h">Adaptive Insurance Submission &amp; Underwriting Assurance System</text>
  <rect x="55" y="125" width="285" height="165" fill="#e4f1eb" class="box"/><text x="198" y="168" text-anchor="middle" class="h">Customer Portal</text><text x="198" y="204" text-anchor="middle" class="t">Product &amp; insurer selection</text><text x="198" y="232" text-anchor="middle" class="t">Adaptive application &amp; documents</text><text x="198" y="260" text-anchor="middle" class="t">Drafts, status &amp; requests</text>
  <rect x="55" y="365" width="285" height="165" fill="#fff0d7" class="box"/><text x="198" y="408" text-anchor="middle" class="h">Underwriter Portal</text><text x="198" y="444" text-anchor="middle" class="t">Assigned review queue</text><text x="198" y="472" text-anchor="middle" class="t">Evidence &amp; issue review</text><text x="198" y="500" text-anchor="middle" class="t">Request, approve or decline</text>
  <rect x="450" y="190" width="305" height="275" fill="#eef3f1" class="box"/><text x="603" y="232" text-anchor="middle" class="h">FastAPI Application</text><text x="603" y="270" text-anchor="middle" class="t">JWT authentication &amp; RBAC</text><text x="603" y="302" text-anchor="middle" class="t">Submission &amp; document APIs</text><text x="603" y="334" text-anchor="middle" class="t">Adaptive requirement engine</text><text x="603" y="366" text-anchor="middle" class="t">OCR / extraction / normalization</text><text x="603" y="398" text-anchor="middle" class="t">Consistency &amp; issue reasoning</text><text x="603" y="430" text-anchor="middle" class="t">Audit trail &amp; lifecycle rules</text>
  <rect x="865" y="125" width="280" height="165" fill="#e9edf7" class="box"/><text x="1005" y="168" text-anchor="middle" class="h">PostgreSQL</text><text x="1005" y="204" text-anchor="middle" class="t">Users &amp; insurer assignments</text><text x="1005" y="232" text-anchor="middle" class="t">Submissions &amp; answers</text><text x="1005" y="260" text-anchor="middle" class="t">Evidence, issues &amp; audit events</text>
  <rect x="865" y="365" width="280" height="165" fill="#f6ebe8" class="box"/><text x="1005" y="408" text-anchor="middle" class="h">Document Processing</text><text x="1005" y="444" text-anchor="middle" class="t">Local file storage</text><text x="1005" y="472" text-anchor="middle" class="t">PDF / image extraction</text><text x="1005" y="500" text-anchor="middle" class="t">Deterministic verification</text>
  <path d="M340 208 H448" class="arrow"/><path d="M340 447 H448" class="arrow"/><path d="M755 260 H863" class="arrow"/><path d="M755 396 H863" class="arrow"/>
  <text x="393" y="190" text-anchor="middle" class="s">HTTPS + JWT</text><text x="809" y="244" text-anchor="middle" class="s">SQLAlchemy</text><text x="809" y="380" text-anchor="middle" class="s">OCR pipeline</text>
  <text x="600" y="603" text-anchor="middle" class="s">Figure 1. High-level architecture of the implemented system.</text>
</svg>
