<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Major Functional Modules</title><desc id="desc">Modules of the customer application, verification services, and underwriter workspace.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#263238}.h{font-size:25px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#465b62}.box{stroke:#355c52;stroke-width:2;rx:16}</style></defs>
  <rect width="1200" height="650" fill="#fbfaf5"/><text x="600" y="48" text-anchor="middle" class="h">Implemented Functional Modules</text>
  <rect x="55" y="110" width="330" height="420" fill="#e4f1eb" class="box"/><text x="220" y="150" text-anchor="middle" class="t">Customer Application</text><text x="90" y="195" class="s">• Authentication and profile</text><text x="90" y="235" class="s">• Product, insurer and underwriter choice</text><text x="90" y="275" class="s">• Personal / commercial intake paths</text><text x="90" y="315" class="s">• Conditional questionnaire</text><text x="90" y="355" class="s">• Document upload and replacement</text><text x="90" y="395" class="s">• Draft save, reopen and delete</text><text x="90" y="435" class="s">• Submit and respond to requests</text>
  <rect x="435" y="110" width="330" height="420" fill="#e9edf7" class="box"/><text x="600" y="150" text-anchor="middle" class="t">Assurance Services</text><text x="470" y="195" class="s">• JWT authentication and role checks</text><text x="470" y="235" class="s">• Requirement rule engine</text><text x="470" y="275" class="s">• OCR and field extraction</text><text x="470" y="315" class="s">• Evidence normalization</text><text x="470" y="355" class="s">• Cross-document consistency checks</text><text x="470" y="395" class="s">• Explainable issue generation</text><text x="470" y="435" class="s">• Submission audit history</text>
  <rect x="815" y="110" width="330" height="420" fill="#fff0d7" class="box"/><text x="980" y="150" text-anchor="middle" class="t">Underwriter Workspace</text><text x="850" y="195" class="s">• Assigned active-review queue</text><text x="850" y="235" class="s">• Application and evidence review</text><text x="850" y="275" class="s">• Clear issue categories and actions</text><text x="850" y="315" class="s">• Resolved issue history</text><text x="850" y="355" class="s">• Additional-information requests</text><text x="850" y="395" class="s">• Approve or decline decision</text><text x="850" y="435" class="s">• Completed decision archive</text>
  <text x="600" y="602" text-anchor="middle" class="s">Figure 3. Functional modules used throughout the implementation.</text>
</svg>
