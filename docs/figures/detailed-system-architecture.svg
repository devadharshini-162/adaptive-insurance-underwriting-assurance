<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Detailed System Architecture</title><desc id="desc">Layered architecture showing portals, API routers, services, data stores and security boundaries.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#243238}.title{font-size:31px;font-weight:700}.layer{font-size:18px;font-weight:700;letter-spacing:1px}.head{font-size:20px;font-weight:700}.item{font-size:16px}.tiny{font-size:13px;fill:#567078}.box{stroke:#3e6558;stroke-width:2;rx:15}.arrow{stroke:#58746a;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke:#789087;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58746a"/></marker>
  </defs>
  <rect width="1600" height="1080" fill="#fbfaf5"/>
  <text x="800" y="48" text-anchor="middle" class="title">Detailed System Architecture</text>
  <text x="55" y="102" class="layer">PRESENTATION LAYER</text><line x1="55" y1="115" x2="1545" y2="115" stroke="#b9c9c0"/>
  <rect x="80" y="145" width="350" height="220" fill="#e2f1e9" class="box"/><text x="255" y="182" text-anchor="middle" class="head">Customer Portal</text><text x="110" y="220" class="item">• Customer login / profile</text><text x="110" y="250" class="item">• Product and insurer selection</text><text x="110" y="280" class="item">• Underwriter selection</text><text x="110" y="310" class="item">• Adaptive application / documents</text><text x="110" y="340" class="item">• Draft, review and resubmission</text>
  <rect x="585" y="145" width="350" height="220" fill="#fff0d7" class="box"/><text x="760" y="182" text-anchor="middle" class="head">Underwriter Portal</text><text x="615" y="220" class="item">• Assigned active-work queue</text><text x="615" y="250" class="item">• Application / evidence workspace</text><text x="615" y="280" class="item">• Issue review and notes</text><text x="615" y="310" class="item">• Information requests</text><text x="615" y="340" class="item">• Approval / decline decision</text>
  <rect x="1090" y="145" width="350" height="220" fill="#e9edf8" class="box"/><text x="1265" y="182" text-anchor="middle" class="head">React + Vite SPA</text><text x="1120" y="220" class="item">• React Router protected routes</text><text x="1120" y="250" class="item">• Auth context / session storage</text><text x="1120" y="280" class="item">• REST API client</text><text x="1120" y="310" class="item">• Loading, error and empty states</text><text x="1120" y="340" class="item">• Human-readable status presentation</text>
  <text x="55" y="425" class="layer">API AND SECURITY LAYER</text><line x1="55" y1="438" x2="1545" y2="438" stroke="#b9c9c0"/>
  <rect x="170" y="470" width="1260" height="135" fill="#edf4f1" class="box"/><text x="800" y="510" text-anchor="middle" class="head">FastAPI REST API</text><text x="225" y="552" class="item">Auth router</text><text x="450" y="552" class="item">Products / insurers</text><text x="720" y="552" class="item">Submissions</text><text x="955" y="552" class="item">Documents</text><text x="1190" y="552" class="item">Rule engine</text><text x="800" y="582" text-anchor="middle" class="tiny">JWT bearer token • customer ownership checks • underwriter assignment checks • role-based route guards</text>
  <text x="55" y="665" class="layer">APPLICATION SERVICES</text><line x1="55" y1="678" x2="1545" y2="678" stroke="#b9c9c0"/>
  <rect x="80" y="710" width="265" height="145" fill="#f6f0df" class="box"/><text x="212" y="748" text-anchor="middle" class="head">Lifecycle Service</text><text x="105" y="785" class="item">Draft</text><text x="105" y="812" class="item">Under review</text><text x="105" y="839" class="item">Info requested / terminal states</text>
  <rect x="390" y="710" width="265" height="145" fill="#f6f0df" class="box"/><text x="522" y="748" text-anchor="middle" class="head">Rule Engine</text><text x="415" y="785" class="item">Product questions</text><text x="415" y="812" class="item">Conditional visibility</text><text x="415" y="839" class="item">Document requirements</text>
  <rect x="700" y="710" width="265" height="145" fill="#f6f0df" class="box"/><text x="832" y="748" text-anchor="middle" class="head">Document Service</text><text x="725" y="785" class="item">Validation / file storage</text><text x="725" y="812" class="item">PDF / image extraction</text><text x="725" y="839" class="item">Normalized evidence</text>
  <rect x="1010" y="710" width="265" height="145" fill="#f6f0df" class="box"/><text x="1142" y="748" text-anchor="middle" class="head">Assurance Services</text><text x="1035" y="785" class="item">Consistency comparison</text><text x="1035" y="812" class="item">Issue mapping</text><text x="1035" y="839" class="item">Audit event generation</text>
  <text x="55" y="915" class="layer">DATA AND FILE LAYER</text><line x1="55" y1="928" x2="1545" y2="928" stroke="#b9c9c0"/>
  <rect x="230" y="960" width="520" height="75" fill="#e8edf7" class="box"/><text x="490" y="992" text-anchor="middle" class="head">PostgreSQL</text><text x="490" y="1018" text-anchor="middle" class="item">Users • insurers • products • submissions • answers • evidence • issues • audit trail</text>
  <rect x="855" y="960" width="520" height="75" fill="#f7e9e5" class="box"/><text x="1115" y="992" text-anchor="middle" class="head">Local Document Storage</text><text x="1115" y="1018" text-anchor="middle" class="item">Uploaded PDFs and images • protected document-content endpoint</text>
  <path d="M430 255 H580 M935 255 H1085 M800 365 V468 M800 605 V708 M832 855 V958 M1115 855 V958" class="arrow"/>
  <path d="M345 782 H388 M655 782 H698 M965 782 H1008" class="dash"/>
</svg>
